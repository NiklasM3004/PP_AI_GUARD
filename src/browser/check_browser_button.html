<!DOCTYPE html>

<!--search for "JAVASCRIPT" to jump to the core logic-->






<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Test - Security Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 800px;
            height: 600px;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 20px 20px 0 0;
            text-align: center;
        }

        .chat-header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .chat-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 80%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            background: #667eea;
            color: white;
            margin-left: auto;
        }

        .message.assistant {
            background: #e9ecef;
            color: #333;
        }

        .chat-input-area {
            padding: 20px;
            background: white;
            border-radius: 0 0 20px 20px;
            border-top: 1px solid #e9ecef;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        #chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            font-size: 16px;
            font-family: inherit;
            resize: none;
            min-height: 50px;
            max-height: 150px;
            transition: border-color 0.2s;
        }

        #chat-input:focus {
            outline: none;
            border-color: #667eea;
        }

        #send-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            min-width: 100px;
        }

        #send-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        #send-button:active {
            transform: translateY(0);
        }

        #send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>🤖 AI Chat Test Interface</h1>
            <p><span class="status-indicator"></span>Test Environment für Security Extension</p>
        </div>

        <div class="chat-messages" id="messages">
            <div class="message assistant">
                👋 Willkommen! Dies ist eine Test-Seite für die AI Security Extension.
                <br><br>
                Versuche sensible Daten zu senden:
                <br>• E-Mail: test@firma.de
                <br>• Kreditkarte: 4532-1234-5678-9010
                <br>• API Key: sk_live_abc123xyz
            </div>
        </div>

        <div class="chat-input-area">
            <div class="input-wrapper">
                <textarea 
                    id="chat-input" 
                    placeholder="Schreibe eine Nachricht... (Teste sensible Daten!)"
                    rows="1"
                ></textarea>
                <button id="send-button">Senden 🚀</button>
            </div>
        </div>
    </div>


    <script>
        // JAVASCRIPT LOGIC STARTS

        // Getting 3 elements
        const input = document.getElementById('chat-input'); // User_input to send to test-mechanism for sensitive data
        const sendButton = document.getElementById('send-button'); // EventListener for button clicked
        const messagesContainer = document.getElementById('messages'); // variable to store the message inside

        // Auto-resize textarea
        input.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        // Send on Enter (Shift+Enter for new line)
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Send button click
        sendButton.addEventListener('click', sendMessage);

        function sendMessage() {
            const text = input.value.trim(); // is removing spaces at the end and at the beginning of the string
            
            if (!text) return;

            // Add user message
            addMessage(text, 'user');

            // Clear input
            input.value = ''; // reset Value to empty string
            input.style.height = 'auto';

            // Simulate AI response
            setTimeout(() => {
                const responses = [
                    '✅ Nachricht empfangen! Die Extension sollte diese analysiert haben.',
                    '🔍 Wurden sensible Daten erkannt?',
                    '💡 Tipp: Öffne die Browser-Console (F12) um Extension-Logs zu sehen!',
                    '🛡️ Deine Nachricht wurde verarbeitet.'
                ];
                const response = responses[Math.floor(Math.random() * responses.length)];
                addMessage(response, 'assistant');
            }, 500);
        }

        function addMessage(text, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = text;
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // ✨ NEU: Sende Message an Python Backend
        async function sendToBackend(text) {
            try {
                console.log('📡 Sende an Python Backend...');
                
                const response = await fetch('http://localhost:5000/api/message', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({text: text})
                });
                
                if (response.ok) {
                    console.log('✅ Backend hat Message empfangen!');
                } else {
                    console.error('❌ Backend Error');
                }
            } catch (error) {
                console.error('❌ Backend nicht erreichbar:', error.message);
                console.log('💡 Starte Backend: python3 backend_minimal.py');
            }
        }

        // Log page load
        console.log('🎯 AI Chat Test-Seite geladen');
        console.log('📍 Bereit für Extension-Tests');
    </script>
</body>
</html>
