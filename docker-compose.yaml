# docker-compose.yml
version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: auth_routing_mongodb
    ports:
      - "27018:27017" # Default MongoDB port
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db # Persist data in a named volume

  mongo-express:
    image: mongo-express
    container_name: auth_routing_express
    ports:
      - "8082:8081" # Default Mongo Express port
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb # Connects to the 'mongodb' service
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_MONGODB_URL: mongodb://admin:password@mongodb:27017/ # Full connection string
      ME_CONFIG_BASICAUTH_USERNAME: 'niklas' # Choose a username for Mongo Express
      ME_CONFIG_BASICAUTH_PASSWORD: 'simple123'
    depends_on:
      - mongodb # Ensures MongoDB starts before Mongo Express

volumes:
  mongodb_data: # Define the named volume for data persistence
